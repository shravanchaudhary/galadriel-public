# Galadriel — the easy button.
#
#   cp .env.example .env      # fill in ANTHROPIC_API_KEY + DISCORD_BOT_TOKEN
#   docker compose up -d --build
#   docker compose logs -f
#
# First boot, seed the memory palace once (otherwise palace_* tools report
# "palace unavailable" until there is something to search):
#   docker compose exec galadriel mempalace init
#   docker compose exec galadriel mempalace init    # create ~/.mempalace/


services:
  galadriel:
    build: .
    image: galadriel:latest
    container_name: galadriel
    env_file: .env
    ports:
      # SECURITY: enable TOWER_AUTH_REQUIRED + TOWER_AUTH_TOKEN + TOWER_SECRET_KEY
      # for form/session auth. Still bound to localhost by default; do NOT change
      # this to "8080:8080" on a public host without auth (or a reverse proxy).
      - "127.0.0.1:8080:8080"
    volumes:
      - palace:/data                 # memory palace + archive (persists)
      - ./memory:/app/memory         # daily memory logs (visible on host)
      - ./config:/app/config         # scheduler/ambient state + active_vision
      - ./knowledge:/app/knowledge   # agent-authored durable knowledge
      - ./state:/app/state           # worker/runtime state
      - ./jobs:/app/jobs             # agent job board
      - ./workflows:/app/workflows   # agent-authored workflows
    restart: unless-stopped

  mongo:
    image: mongo:8
    profiles: ["mongo"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  palace:
  mongo-data:
