# Galadriel — the easy button.
#
#   cp .env.example .env      # fill in ANTHROPIC_API_KEY + DISCORD_BOT_TOKEN
#   docker compose up -d --build
#   docker compose logs -f
#
# The memory palace needs no init step — it builds itself in MongoDB/DocumentDB
# on first write, using MONGO_URI / MONGO_DB from the environment.

services:
  galadriel:
    build: .
    image: galadriel:latest
    container_name: galadriel
    env_file: .env
    environment:
      GALADRIEL_ENV: local
      GALADRIEL_LOCAL_STATE_ROOT: /mnt/efs
      GALADRIEL_LOCAL_DEFAULTS_ROOT: /opt/galadriel-defaults
    ports:
      # SECURITY: enable TOWER_AUTH_REQUIRED + TOWER_AUTH_TOKEN + TOWER_SECRET_KEY
      # for form/session auth. Still bound to localhost by default; do NOT change
      # this to "8080:8080" on a public host without auth (or a reverse proxy).
      - "127.0.0.1:8080:8080"
    volumes:
      # Mirrors the production /mnt/efs layout without dirtying repo defaults.
      - ./.galadriel-local:/mnt/efs
    restart: unless-stopped

  mongo:
    image: mongo:8
    profiles: ["mongo"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mongo-data:
