<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mirror of Galadriel — Chat</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container chat-container">
        <header>
            <h1>The Mirror of Galadriel</h1>
            <p class="subtitle">Direct channel to the agent</p>
            <div class="header-actions">
                <a href="/" class="btn btn-small">Tower</a>
                <button onclick="clearChat()" class="btn btn-small btn-danger">Clear History</button>
            </div>
        </header>

        <div id="chat-log" class="chat-log"></div>

        <form id="chat-form" class="chat-form" onsubmit="sendMessage(event)">
            <textarea
                id="chat-input"
                class="chat-input"
                placeholder="Speak, my lord..."
                rows="2"
                onkeydown="handleKey(event)"
            ></textarea>
            <button type="submit" class="btn" id="send-btn">Send</button>
        </form>
    </div>

    <script>
    const chatLog = document.getElementById('chat-log');
    const chatInput = document.getElementById('chat-input');
    const sendBtn = document.getElementById('send-btn');

    // Live-turn rendering state
    let bodyEl = null;     // current assistant message body
    let textEl = null;     // active streaming text block
    let thoughtEl = null;  // active thought block
    let toolCard = null;   // last tool card awaiting its result

    // Load existing history on page load
    (async () => {
        const res = await fetch('/api/history?channel=tower');
        const data = await res.json();
        for (const msg of data.history || []) {
            appendMessage(msg.role, msg.text);
        }
        scrollToBottom();
    })();

    function appendMessage(role, text) {
        const div = document.createElement('div');
        div.className = `msg msg-${role}`;
        const label = role === 'user' ? 'You' : 'Galadriel';
        div.innerHTML = `<strong>${label}</strong><div class="msg-text">${escapeHtml(text)}</div>`;
        chatLog.appendChild(div);
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function scrollToBottom() {
        chatLog.scrollTop = chatLog.scrollHeight;
    }

    // True when the user is at (or within a few px of) the bottom. Used to
    // avoid yanking the view down while they've scrolled up to read.
    function isAtBottom() {
        return chatLog.scrollHeight - chatLog.scrollTop - chatLog.clientHeight < 40;
    }

    function handleKey(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage(e);
        }
    }

    // ── Streaming renderers ──────────────────────────────────────
    function startAssistant() {
        const div = document.createElement('div');
        div.className = 'msg msg-assistant';
        div.innerHTML = '<strong>Galadriel</strong>';
        bodyEl = document.createElement('div');
        bodyEl.className = 'msg-body';
        const typing = document.createElement('span');
        typing.className = 'typing';
        typing.innerHTML = '<i></i><i></i><i></i>';
        bodyEl.appendChild(typing);
        div.appendChild(bodyEl);
        chatLog.appendChild(div);
        textEl = null; thoughtEl = null; toolCard = null;
    }

    function clearTyping() {
        const t = bodyEl && bodyEl.querySelector('.typing');
        if (t) t.remove();
    }

    function appendText(delta) {
        clearTyping();
        if (!textEl) {
            textEl = document.createElement('div');
            textEl.className = 'msg-text';
            bodyEl.appendChild(textEl);
        }
        textEl.textContent += delta;
    }

    function appendThought(delta) {
        clearTyping();
        if (!thoughtEl) {
            const d = document.createElement('details');
            d.className = 'thought';
            d.open = true;
            d.innerHTML = '<summary>Thinking</summary>';
            thoughtEl = document.createElement('div');
            thoughtEl.className = 'thought-body';
            d.appendChild(thoughtEl);
            bodyEl.appendChild(d);
        }
        thoughtEl.textContent += delta;
    }

    function addToolCall(name, input) {
        clearTyping();
        textEl = null; thoughtEl = null;
        const card = document.createElement('details');
        card.className = 'tool-card running';
        card.innerHTML =
            '<summary class="tool-head"><span class="tool-spinner"></span>'
            + `<span class="tool-name">${escapeHtml(name)}</span>`
            + `<span class="tool-preview">${escapeHtml(input || '')}</span></summary>`
            + `<div class="tool-input">${escapeHtml(input || '')}</div>`
            + '<pre class="tool-output"></pre>';
        bodyEl.appendChild(card);
        toolCard = card;
    }

    function addToolResult(output) {
        if (!toolCard) return;
        toolCard.classList.remove('running');
        toolCard.classList.add('done');
        toolCard.querySelector('.tool-output').textContent = output || '';
        toolCard = null;
        textEl = null;
    }

    function handleEvent(ev) {
        switch (ev.type) {
            case 'thought': appendThought(ev.text); break;
            case 'text': appendText(ev.text); break;
            case 'tool_call': addToolCall(ev.name, ev.input); break;
            case 'tool_result': addToolResult(ev.output); break;
            case 'done':
                clearTyping();
                bodyEl.querySelectorAll('details.thought').forEach(d => {
                    d.open = false;
                    d.querySelector('summary').textContent = 'Thought process';
                });
                if (!bodyEl.querySelector('.msg-text') && ev.text) appendText(ev.text);
                break;
            case 'error': appendText(`[Error] ${ev.error}`); break;
        }
    }

    async function sendMessage(e) {
        e.preventDefault();
        const message = chatInput.value.trim();
        if (!message) return;

        appendMessage('user', message);
        chatInput.value = '';
        sendBtn.disabled = true;
        sendBtn.textContent = 'Thinking…';
        startAssistant();
        scrollToBottom();

        try {
            const res = await fetch('/api/chat/stream', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({message}),
            });
            if (!res.ok || !res.body) {
                const err = await res.json().catch(() => ({error: res.statusText}));
                appendText(`[Error] ${err.error || res.statusText}`);
                return;
            }
            const reader = res.body.getReader();
            const decoder = new TextDecoder();
            let buf = '';
            while (true) {
                const {value, done} = await reader.read();
                if (done) break;
                buf += decoder.decode(value, {stream: true});
                let idx;
                while ((idx = buf.indexOf('\n\n')) !== -1) {
                    const frame = buf.slice(0, idx);
                    buf = buf.slice(idx + 2);
                    if (!frame.startsWith('data:')) continue;
                    const payload = frame.slice(5).trim();
                    if (!payload) continue;
                    const stick = isAtBottom();
                    handleEvent(JSON.parse(payload));
                    if (stick) scrollToBottom();
                }
            }
        } catch (err) {
            appendText(`[Error] ${err.message}`);
        } finally {
            const stick = isAtBottom();
            clearTyping();
            sendBtn.disabled = false;
            sendBtn.textContent = 'Send';
            if (stick) scrollToBottom();
        }
    }

    async function clearChat() {
        if (!confirm('Clear conversation history?')) return;
        await fetch('/api/clear', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({channel: 'tower'}),
        });
        chatLog.innerHTML = '';
    }
    </script>
</body>
</html>
