<!-- Agent chat overlay — shared across console pages. -->
<script type="application/json" id="page-context">{{ page_context | tojson }}</script>

<button id="wfc-launcher" class="wfc-launcher" onclick="wfcToggle()"
        title="Chat with agent" aria-label="Chat with agent">
    <svg class="wfc-launcher-icon" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false">
        <path fill="currentColor" d="M4 4h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H8l-4 4v-4H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm2 4v2h12V8H6zm0 4v2h8v-2H6z"/>
    </svg>
</button>

<div id="wfc-panel" class="wfc-panel" hidden>
    <div class="wfc-resize wfc-resize-n" data-dir="n"></div>
    <div class="wfc-resize wfc-resize-w" data-dir="w"></div>
    <div class="wfc-resize wfc-resize-nw" data-dir="nw"></div>
    <div class="wfc-head">
        <span class="wfc-title">Agent</span>
        <span class="wfc-sub" id="wfc-context-label"></span>
        <select id="wfc-model-select" class="wfc-model-select interval-select" title="Agent model"></select>
        <button type="button" class="wfc-head-btn wfc-clear-btn" id="wfc-clear" title="Archive history and start fresh">Clear</button>
        <button type="button" class="wfc-head-btn" id="wfc-expand" title="Expand to sidebar">⤢</button>
        <button type="button" class="wfc-head-btn wfc-x" onclick="wfcToggle()" title="Close">×</button>
    </div>
    <div class="wfc-queue">
        <div class="wfc-queue-head">
            <span id="wfc-queue-status">idle · 0 queued</span>
        </div>
        <div id="wfc-queue-items" class="wfc-queue-items" hidden></div>
    </div>
    <div id="wfc-log" class="wfc-log"></div>
    <div id="wfc-previews" class="wfc-previews" hidden></div>
    <form id="wfc-form" class="wfc-form" onsubmit="wfcSend(event)">
        <button type="button" class="wfc-attach" id="wfc-attach" title="Attach image (or paste one)">📎</button>
        <input type="file" id="wfc-file" accept="image/png,image/jpeg,image/gif,image/webp" multiple hidden>
        <textarea id="wfc-input" class="wfc-input" rows="1"
            placeholder="Tell the agent what to do…"
            onkeydown="wfcKey(event)"></textarea>
        <button type="submit" class="wfc-send" id="wfc-send" title="Send">→</button>
        <button type="button" class="wfc-stop" id="wfc-stop" title="Stop agent" hidden>■</button>
    </form>
</div>

<script src="/static/chat_render.js"></script>
<script src="/static/chat_live.js"></script>
<script>
(function () {
    const log = document.getElementById('wfc-log');
    const input = document.getElementById('wfc-input');
    const sendBtn = document.getElementById('wfc-send');
    const stopBtn = document.getElementById('wfc-stop');
    const queueStatus = document.getElementById('wfc-queue-status');
    const queueItems = document.getElementById('wfc-queue-items');
    const panel = document.getElementById('wfc-panel');
    const launcher = document.getElementById('wfc-launcher');
    const expandBtn = document.getElementById('wfc-expand');
    const LAYOUT_KEY = 'wfc-layout';
    const LAYOUT_DEFAULTS = { width: 380, height: 540, expanded: false };
    const MIN_W = 320, MIN_H = 280;
    const RENDER_OPTS = ChatLive.RENDER_OPTS;

    let pageContext = {};
    try {
        pageContext = JSON.parse(document.getElementById('page-context').textContent || '{}');
    } catch (e) { pageContext = {}; }

    const label = document.getElementById('wfc-context-label');
    label.textContent = pageContext.label || pageContext.view || '';

    const modelSelect = document.getElementById('wfc-model-select');

    async function wfcLoadModel() {
        try {
            const res = await fetch('/api/model?channel=main');
            const data = await res.json();
            modelSelect.innerHTML = '';
            for (const m of data.options || []) {
                const opt = document.createElement('option');
                opt.value = m;
                opt.textContent = m;
                if (m === data.model) opt.selected = true;
                modelSelect.appendChild(opt);
            }
            if (!data.persisted) {
                modelSelect.title = 'Model resets on restart — set MONGO_URI / MONGO_DB to persist';
            }
            modelSelect.dataset.current = data.model;
        } catch (e) {
            modelSelect.hidden = true;
        }
    }

    async function wfcChangeModel() {
        const model = modelSelect.value;
        const prev = modelSelect.dataset.current || model;
        try {
            const res = await fetch('/api/model', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ model, channel: 'main' }),
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Failed to set model');
            modelSelect.dataset.current = data.model;
            const dash = document.getElementById('model-select');
            if (dash) dash.value = data.model;
        } catch (err) {
            modelSelect.value = prev;
            alert(err.message || 'Failed to set model');
        }
    }

    modelSelect.addEventListener('change', () => wfcChangeModel());

    let activeStreams = 0;

    // ── Image attachments (file picker + paste) ─────────────────
    const attachBtn = document.getElementById('wfc-attach');
    const fileInput = document.getElementById('wfc-file');
    const previews = document.getElementById('wfc-previews');
    const MAX_IMAGES = 5;
    const MAX_IMAGE_BYTES = 5 * 1024 * 1024;
    let pendingImages = []; // { data (base64, no prefix), dataUrl }

    function renderPreviews() {
        previews.innerHTML = '';
        previews.hidden = pendingImages.length === 0;
        pendingImages.forEach((img, idx) => {
            const chip = document.createElement('span');
            chip.className = 'wfc-preview-chip';
            const thumb = document.createElement('img');
            thumb.src = img.dataUrl;
            const x = document.createElement('button');
            x.type = 'button';
            x.textContent = '×';
            x.title = 'Remove image';
            x.addEventListener('click', () => {
                pendingImages.splice(idx, 1);
                renderPreviews();
            });
            chip.appendChild(thumb);
            chip.appendChild(x);
            previews.appendChild(chip);
        });
    }

    function addImageFile(file) {
        if (!file || !file.type.startsWith('image/')) return;
        if (pendingImages.length >= MAX_IMAGES) {
            alert(`Max ${MAX_IMAGES} images per message.`);
            return;
        }
        if (file.size > MAX_IMAGE_BYTES) {
            alert(`${file.name || 'Image'} is over the 5MB limit.`);
            return;
        }
        const reader = new FileReader();
        reader.onload = () => {
            const dataUrl = reader.result;
            pendingImages.push({ data: dataUrl.split(',', 2)[1], dataUrl });
            renderPreviews();
        };
        reader.readAsDataURL(file);
    }

    attachBtn.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', () => {
        for (const f of fileInput.files) addImageFile(f);
        fileInput.value = '';
    });
    input.addEventListener('paste', (e) => {
        for (const item of (e.clipboardData || {}).items || []) {
            if (item.type && item.type.startsWith('image/')) {
                e.preventDefault();
                addImageFile(item.getAsFile());
            }
        }
    });

    function wfcSetTurnActive(active) {
        activeStreams = Math.max(0, activeStreams + (active ? 1 : -1));
        stopBtn.hidden = activeStreams === 0;
    }

    async function wfcStopTurn() {
        stopBtn.disabled = true;
        try {
            await fetch('/api/chat/stop', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ channel: 'main' }),
            });
            await wfcLoadQueue();
        } catch (err) {
            appendText(`[Error] ${err.message}`);
            wfcSetTurnActive(false);
        } finally {
            stopBtn.disabled = false;
        }
    }

    stopBtn.addEventListener('click', () => wfcStopTurn());

    async function queueMutation(url, options) {
        const res = await fetch(url, options);
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'Queue changed; refresh and try again');
        await wfcLoadQueue();
        return data;
    }

    async function wfcLoadQueue() {
        try {
            const res = await fetch('/api/chat/queue?channel=main');
            const data = await res.json();
            if (!res.ok) return;
            const state = data.paused ? 'paused' : (data.busy ? 'busy' : 'idle');
            queueStatus.textContent = `${state} · ${data.depth || 0} queued`;
            stopBtn.hidden = !data.busy && activeStreams === 0;
            queueItems.innerHTML = '';
            for (const item of data.items || []) {
                const row = document.createElement('div');
                row.className = 'wfc-queue-item';
                row.draggable = true;
                row.dataset.id = item.id;
                row.dataset.revision = item.revision;
                const text = document.createElement('span');
                text.className = 'wfc-queue-text';
                text.textContent = item.display_text || '(attachment)';
                text.title = text.textContent;
                const edit = document.createElement('button');
                edit.type = 'button'; edit.textContent = 'Edit';
                edit.addEventListener('click', async () => {
                    const next = prompt('Edit queued message', item.display_text || '');
                    if (next === null) return;
                    try {
                        await queueMutation(`/api/chat/queue/${encodeURIComponent(item.id)}`, {
                            method: 'PATCH',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ revision: item.revision, display_text: next }),
                        });
                    } catch (err) { alert(err.message); }
                });
                const del = document.createElement('button');
                del.type = 'button'; del.textContent = 'Delete';
                del.addEventListener('click', async () => {
                    try {
                        await queueMutation(`/api/chat/queue/${encodeURIComponent(item.id)}`, {
                            method: 'DELETE',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ revision: item.revision }),
                        });
                    } catch (err) { alert(err.message); }
                });
                row.append(text, edit, del);
                queueItems.appendChild(row);
            }
            queueItems.hidden = !(data.items || []).length;
        } catch (e) {}
    }

    let draggedQueueItem = null;
    queueItems.addEventListener('dragstart', e => {
        draggedQueueItem = e.target.closest('.wfc-queue-item');
    });
    queueItems.addEventListener('dragover', e => {
        e.preventDefault();
        const target = e.target.closest('.wfc-queue-item');
        if (draggedQueueItem && target && target !== draggedQueueItem) {
            const after = e.clientY > target.getBoundingClientRect().top + target.offsetHeight / 2;
            queueItems.insertBefore(draggedQueueItem, after ? target.nextSibling : target);
        }
    });
    queueItems.addEventListener('drop', async e => {
        e.preventDefault();
        const items = Array.from(queueItems.querySelectorAll('.wfc-queue-item')).map(row => ({
            id: row.dataset.id, revision: Number(row.dataset.revision),
        }));
        try {
            await queueMutation('/api/chat/queue/reorder', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ channel: 'main', items }),
            });
        } catch (err) { alert(err.message); await wfcLoadQueue(); }
        draggedQueueItem = null;
    });

    function escapeHtml(t) {
        return ChatRender.escapeHtml(t);
    }
    function atBottom() {
        return log.scrollHeight - log.scrollTop - log.clientHeight < 40;
    }
    function toBottom() { log.scrollTop = log.scrollHeight; }

    function appendMessage(role, text) {
        if (role === 'user') {
            return ChatRender.appendUserMessage(log, text, RENDER_OPTS);
        }
        return ChatRender.appendAssistantTurn(log, [{ type: 'text', text }], RENDER_OPTS);
    }

    function startAssistant() {
        const div = document.createElement('div');
        div.className = 'wfc-msg wfc-msg-assistant';
        const bodyEl = document.createElement('div');
        bodyEl.className = 'msg-body';
        const typing = document.createElement('span');
        typing.className = 'typing';
        typing.innerHTML = '<i></i><i></i><i></i>';
        bodyEl.appendChild(typing);
        div.appendChild(bodyEl);
        log.appendChild(div);
        return { div, bodyEl, textEl: null, thoughtEl: null, toolCard: null, finished: false };
    }
    function clearTyping(turn) {
        const t = turn.bodyEl && turn.bodyEl.querySelector('.typing');
        if (t) t.remove();
    }
    function appendText(delta, turn) {
        if (!turn) {
            turn = startAssistant();
        }
        clearTyping(turn);
        if (!turn.textEl) {
            turn.textEl = document.createElement('div');
            turn.textEl.className = 'msg-text';
            turn.bodyEl.appendChild(turn.textEl);
        }
        turn.textEl.textContent += delta;
    }
    function appendThought(delta, turn) {
        clearTyping(turn);
        if (!turn.thoughtEl) {
            const d = document.createElement('details');
            d.className = 'thought';
            d.innerHTML = '<summary>Thinking</summary>';
            turn.thoughtEl = document.createElement('div');
            turn.thoughtEl.className = 'thought-body';
            d.appendChild(turn.thoughtEl);
            turn.bodyEl.appendChild(d);
        }
        turn.thoughtEl.textContent += delta;
    }
    function addToolCall(name, inp, turn) {
        clearTyping(turn);
        turn.textEl = null; turn.thoughtEl = null;
        const card = document.createElement('details');
        card.className = 'tool-card running';
        card.innerHTML =
            '<summary class="tool-head"><span class="tool-spinner"></span>'
            + `<span class="tool-name">${escapeHtml(name)}</span>`
            + `<span class="tool-preview">${escapeHtml(inp || '')}</span></summary>`
            + `<div class="tool-input">${escapeHtml(inp || '')}</div>`
            + '<pre class="tool-output"></pre>';
        turn.bodyEl.appendChild(card);
        turn.toolCard = card;
    }
    function addToolResult(output, turn) {
        if (!turn.toolCard) return;
        turn.toolCard.classList.remove('running');
        turn.toolCard.classList.add('done');
        turn.toolCard.querySelector('.tool-output').textContent = output || '';
        turn.toolCard = null; turn.textEl = null;
    }

    function handleEvent(ev, turn) {
        if (turn.finished) return;
        switch (ev.type) {
            case 'thought': appendThought(ev.text, turn); break;
            case 'text': appendText(ev.text, turn); break;
            case 'tool_call': addToolCall(ev.name, ev.input, turn); break;
            case 'tool_result': addToolResult(ev.output, turn); break;
            case 'done':
                clearTyping(turn);
                if (!turn.bodyEl.querySelector('.msg-text') && ev.text) appendText(ev.text, turn);
                if (!turn.bodyEl.textContent.trim()) turn.div.remove();
                wfcFinishTurn(turn);
                break;
            case 'stopped':
                clearTyping(turn);
                appendText(ev.text || '(Stopped)', turn);
                wfcFinishTurn(turn);
                break;
            case 'error': appendText(`[Error] ${ev.error}`, turn); wfcFinishTurn(turn); break;
        }
    }

    async function wfcRefreshHistory() {
        try {
            const data = await ChatLive.fetchHistory();
            ChatLive.hydrate(log, (data.history || []).slice(-40));
        } catch (e) {}
    }

    function wfcFinishTurn(turn) {
        if (turn && turn.finished) return;
        if (turn) turn.finished = true;
        wfcSetTurnActive(false);
        wfcLoadQueue();
        wfcRefreshHistory();
        if (activeStreams === 0 && pageContext.reload_on_done !== false) {
            setTimeout(() => location.reload(), 900);
        }
    }

    function loadLayout() {
        try {
            return Object.assign({}, LAYOUT_DEFAULTS, JSON.parse(localStorage.getItem(LAYOUT_KEY) || '{}'));
        } catch (e) {
            return Object.assign({}, LAYOUT_DEFAULTS);
        }
    }
    function saveLayout(layout) {
        localStorage.setItem(LAYOUT_KEY, JSON.stringify(layout));
    }
    function clampWidth(w) {
        const max = Math.floor(window.innerWidth * 0.92);
        return Math.min(max, Math.max(MIN_W, w));
    }
    function clampHeight(h) {
        const max = window.innerHeight - 48;
        return Math.min(max, Math.max(MIN_H, h));
    }
    function applyLayout(layout) {
        panel.style.width = layout.width + 'px';
        const open = !panel.hasAttribute('hidden');
        if (layout.expanded) {
            panel.classList.add('expanded');
            panel.style.height = '';
            expandBtn.textContent = '⤡';
            expandBtn.title = 'Collapse to floating panel';
        } else {
            panel.classList.remove('expanded');
            panel.style.height = layout.height + 'px';
            expandBtn.textContent = '⤢';
            expandBtn.title = 'Expand to sidebar';
        }
        if (layout.expanded && open) {
            document.body.classList.add('wfc-sidebar-open');
            document.body.style.setProperty('--wfc-sidebar-w', layout.width + 'px');
        } else {
            document.body.classList.remove('wfc-sidebar-open');
            document.body.style.removeProperty('--wfc-sidebar-w');
        }
    }
    function setExpanded(expanded) {
        const layout = loadLayout();
        layout.expanded = expanded;
        if (expanded) layout.width = clampWidth(Math.max(layout.width, 420));
        saveLayout(layout);
        applyLayout(layout);
    }
    expandBtn.addEventListener('click', () => setExpanded(!panel.classList.contains('expanded')));

    (function initResize() {
        let active = null;
        function onMove(e) {
            if (!active) return;
            const layout = loadLayout();
            const dx = e.clientX - active.x;
            const dy = e.clientY - active.y;
            if (active.dir.includes('w')) layout.width = clampWidth(active.w - dx);
            if (active.dir.includes('n') && !layout.expanded) layout.height = clampHeight(active.h - dy);
            saveLayout(layout);
            applyLayout(layout);
        }
        function onUp() {
            active = null;
            document.body.classList.remove('wfc-resizing');
            document.removeEventListener('mousemove', onMove);
            document.removeEventListener('mouseup', onUp);
        }
        panel.querySelectorAll('.wfc-resize').forEach(handle => {
            handle.addEventListener('mousedown', e => {
                if (e.button !== 0) return;
                e.preventDefault();
                const layout = loadLayout();
                const dir = handle.dataset.dir;
                if (layout.expanded && dir !== 'w') return;
                active = {
                    dir,
                    x: e.clientX,
                    y: e.clientY,
                    w: panel.offsetWidth,
                    h: panel.offsetHeight,
                };
                document.body.classList.add('wfc-resizing');
                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', onUp);
            });
        });
    })();

    window.addEventListener('resize', () => {
        const layout = loadLayout();
        layout.width = clampWidth(layout.width);
        if (!layout.expanded) layout.height = clampHeight(layout.height);
        saveLayout(layout);
        applyLayout(layout);
    });

    function wfcIsOpen() {
        return !panel.hasAttribute('hidden');
    }

    window.wfcOpen = function () {
        if (wfcIsOpen()) {
            input.focus();
            return;
        }
        panel.removeAttribute('hidden');
        launcher.classList.add('open');
        sessionStorage.setItem('wfc-open', '1');
        input.focus();
        toBottom();
        applyLayout(loadLayout());
    };

    window.wfcClose = function () {
        if (!wfcIsOpen()) return;
        panel.setAttribute('hidden', '');
        launcher.classList.remove('open');
        sessionStorage.removeItem('wfc-open');
        applyLayout(loadLayout());
    };

    window.wfcToggle = function () {
        if (wfcIsOpen()) wfcClose();
        else wfcOpen();
    };

    window.wfcKey = function (e) {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); wfcSend(e); }
    };

    window.wfcClear = async function () {
        if (!confirm('Start a fresh conversation? Current history will be archived to memory first.')) return;
        const btn = document.getElementById('wfc-clear');
        if (btn) btn.disabled = true;
        try {
            const res = await fetch('/api/clear', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ channel: 'main' }),
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
                alert(data.error || 'Failed to clear conversation');
                return;
            }
            log.innerHTML = '';
        } catch (err) {
            alert(err.message || 'Failed to clear conversation');
        } finally {
            if (btn) btn.disabled = false;
        }
    };

    window.wfcSend = async function (e) {
        e.preventDefault();
        const message = input.value.trim();
        const images = pendingImages.slice();
        if (!message && !images.length) return;
        input.value = '';
        pendingImages = [];
        renderPreviews();
        wfcSetTurnActive(true);
        await ChatLive.streamChat({
            log,
            message,
            images,
            context: pageContext,
            onDone: () => wfcFinishTurn({ finished: false }),
            onError: () => wfcFinishTurn({ finished: false }),
        });
        // streamChat invokes onDone or onError exactly once.
    };

    (async () => {
        const clearBtn = document.getElementById('wfc-clear');
        if (clearBtn) clearBtn.addEventListener('click', () => wfcClear());

        if (sessionStorage.getItem('wfc-open')) {
            panel.removeAttribute('hidden');
            launcher.classList.add('open');
        }
        applyLayout(loadLayout());
        wfcLoadModel();
        wfcLoadQueue();
        setInterval(() => { if (wfcIsOpen()) wfcLoadQueue(); }, 2000);
        try {
            const data = await ChatLive.fetchHistory();
            ChatLive.hydrate(log, (data.history || []).slice(-40));
        } catch (e) {}
    })();
})();
</script>
