<header class="site-header">

            <span class="site-brand-text">Clyra Console</span>
        </a>
        <nav class="site-nav" aria-label="Main">
            <a href="/" class="{{ 'active' if request.path == '/' }}">Dashboard</a>

            <a href="/loops" class="{{ 'active' if request.path.startswith('/loops') }}">Loops</a>
            <a href="/workflows" class="{{ 'active' if request.path.startswith('/workflows') or request.path.startswith('/w/') or request.path.startswith('/approvals') }}">Workflows</a>
            <a href="/config" class="{{ 'active' if request.path.startswith('/config') }}">Configuration</a>
            <a href="/palace" class="{{ 'active' if request.path.startswith('/palace') }}">Memory</a>

        </nav>
    </div>
</header>
